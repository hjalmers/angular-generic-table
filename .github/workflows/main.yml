name: CI
on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build library
        run: npm run build

      - name: Build documentation and demo site
        run: npm run build-storybook

      - name: Deploy documentation to GitHub Pages
        if: github.ref == 'refs/heads/release/rc'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: dist/storybook
          target-folder: rc

      # npm publishing uses OIDC trusted publishing (no NPM_TOKEN): the
      # @semantic-release/npm plugin exchanges the GitHub Actions OIDC token
      # (id-token: write, above) for a short-lived npm token via the package's
      # configured trusted publisher, and publishes with provenance.
      - name: Run semantic release and publish new version to npm
        if: github.ref == 'refs/heads/release/rc'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run semantic-release
